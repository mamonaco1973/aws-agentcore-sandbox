<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="A web app calls an API that writes each question to DynamoDB and S3 and invokes a Strands agent on AgentCore Runtime directly, with no queue; the agent calls Claude on Bedrock, runs code in a per-conversation AgentCore Code Interpreter session, keeps history in AgentCore Memory, and writes results back to DynamoDB and S3, which the web app polls"><defs><marker id="a_e_web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_poll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_sand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5bb"/></marker><marker id="a_e_store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs><rect width="1620" height="790" fill="#0d1117"/><path d="M460,95.0 L595,95.0" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_web)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="